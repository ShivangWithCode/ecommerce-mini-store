{% extends "base.html" %}
{% block title %}{{ product[1] }}{% endblock %}
{% block content %}
<div class="product-detail">
    <img src="{{ url_for('static', filename='images/' + product[5]) }}" alt="{{ product[1] }}">
    <div class="info">
        <h1>{{ product[1] }}</h1>
        <span class="category-badge">{{ product[4] }}</span>
        <p class="price">₹{{ product[2] }}</p>
        <p>{{ product[3] }}</p>
        <a href="{{ url_for('add_to_cart', product_id=product[0]) }}" class="btn">🛒 Add to Cart</a>
    </div>
</div>
{% endblock %}
