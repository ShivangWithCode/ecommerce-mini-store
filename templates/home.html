{% extends "base.html" %}
{% block title %}Home - E-Commerce Store{% endblock %}

{% block content %}
    <h1>Welcome to My E-Commerce Mini Store!</h1>
    <form method="GET" action="{{ url_for('home') }}">
    <input type="text" name="search" placeholder="Search products..." value="{{ search_query }}">
    <select name="category">
        <option value="">All Categories</option>
        {% for cat in categories %}
            <option value="{{ cat[0] }}" {% if selected_category == cat[0] %}selected{% endif %}>{{ cat[0] }}</option>
        {% endfor %}
    </select>
    <button type="submit">Search</button>
</form>
    <p>Yahan aapko best products milenge.</p>
    {% for product in products %}
    <div>
        <h3><a href="{{ url_for('product_detail', product_id=product[0]) }}">{{ product[1] }}</a></h3>
        <p>Price: ₹{{ product[2] }}</p>
        <p>{{ product[3] }}</p>
    </div>
    {% endfor %}
{% endblock %}
